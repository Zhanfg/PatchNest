name: Import upstream CLI source

on:
  push:
    branches:
      - restart/restore-cli-source
    paths:
      - .github/workflows/import-upstream-source.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PatchNest branch
        uses: actions/checkout@v6
        with:
          ref: restart/restore-cli-source
          fetch-depth: 0

      - name: Import fixed upstream snapshot
        env:
          UPSTREAM_REPOSITORY: KernelSU-Next/KPatch-Next
          UPSTREAM_COMMIT: 0fe6d142266b80e5aa445a7ea1534f88a8f33a35
        run: |
          set -euo pipefail
          rm -rf /tmp/kpatch-next
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${UPSTREAM_REPOSITORY}.git" /tmp/kpatch-next
          git -C /tmp/kpatch-next checkout --detach "$UPSTREAM_COMMIT"

          rm -rf src
          mkdir -p src
          cp /tmp/kpatch-next/user/*.c src/
          cp /tmp/kpatch-next/user/*.h src/
          cp /tmp/kpatch-next/LICENSE LICENSE
          cp /tmp/kpatch-next/version version
          cp /tmp/kpatch-next/revision revision

          cat > SOURCE_IMPORT_MANIFEST.json <<EOF
          {
            "upstreamRepository": "${UPSTREAM_REPOSITORY}",
            "upstreamCommit": "${UPSTREAM_COMMIT}",
            "upstreamDirectory": "user",
            "version": "0.13.5-2",
            "importedBy": "GitHub Actions"
          }
          EOF

          cat > UPSTREAM_BASELINE.md <<EOF
          # Upstream baseline

          PatchNest CLI source is imported from:

          - Repository: \`${UPSTREAM_REPOSITORY}\`
          - Commit: \`${UPSTREAM_COMMIT}\`
          - Directory: \`user/\`
          - Upstream version: \`0.13.5-2\`

          Only the standalone user-space CLI sources are imported. Kernel and
          patching-tool sources remain in their dedicated repositories.
          EOF

      - name: Commit imported sources
        run: |
          set -euo pipefail
          git config user.name "patchnest-import-bot"
          git config user.email "patchnest-import-bot@users.noreply.github.com"
          git add src LICENSE version revision SOURCE_IMPORT_MANIFEST.json UPSTREAM_BASELINE.md
          if git diff --cached --quiet; then
            echo "Source snapshot already matches the pinned upstream commit."
            exit 0
          fi
          git commit -m "feat(source): restore CLI source from pinned upstream snapshot"
          git push origin HEAD:restart/restore-cli-source
