name: Rust refactor foundation

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-foundation.yml'
  push:
    branches:
      - 'rust/**'
    paths:
      - 'rust/**'
      - '.github/workflows/rust-foundation.yml'
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify Rust toolchain
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Build foundation executable
        run: cargo build --manifest-path rust/Cargo.toml --release
