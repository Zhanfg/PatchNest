name: One-shot PatchNest monorepo import

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-monorepo.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout merge branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: merge/patchnest-monorepo
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import PatchNest-Module with history
        run: |
          set -euo pipefail
          if [ ! -f module/README.md ]; then
            git remote add patchnest-module https://github.com/Zhanfg/PatchNest-Module.git
            git fetch patchnest-module \
              '+refs/heads/*:refs/remotes/patchnest-module/*' \
              '+refs/tags/*:refs/tags/provenance/module/*'
            git subtree add --prefix=module patchnest-module main
          fi

      - name: Import PatchNest-Kpms with history
        run: |
          set -euo pipefail
          if [ ! -f kpms/README.md ]; then
            git remote add patchnest-kpms https://github.com/Zhanfg/PatchNest-Kpms.git
            git fetch patchnest-kpms \
              '+refs/heads/*:refs/remotes/patchnest-kpms/*' \
              '+refs/tags/*:refs/tags/provenance/kpms/*'
            git subtree add --prefix=kpms patchnest-kpms main
          fi

      - name: Mirror provenance refs
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            branch=${ref#refs/remotes/patchnest-module/}
            [ "$branch" = "HEAD" ] && continue
            git push origin "$ref:refs/heads/provenance/module/$branch"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/patchnest-module/)
          git push origin 'refs/tags/provenance/module/*:refs/tags/provenance/module/*' || true

          while IFS= read -r ref; do
            branch=${ref#refs/remotes/patchnest-kpms/}
            [ "$branch" = "HEAD" ] && continue
            git push origin "$ref:refs/heads/provenance/kpms/$branch"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/patchnest-kpms/)
          git push origin 'refs/tags/provenance/kpms/*:refs/tags/provenance/kpms/*' || true

      - name: Record provenance and push
        run: |
          set -euo pipefail
          mkdir -p docs/provenance
          module_main=$(git rev-parse refs/remotes/patchnest-module/main)
          kpms_main=$(git rev-parse refs/remotes/patchnest-kpms/main)
          cat > docs/provenance/imports.md <<EOF
          # Component import provenance

          - PatchNest CLI: canonical history, relocated under `cli/`; baseline merge commit `d3f3e394806c897ee67c1a2befb597d68e34cc33`.
          - PatchNest-Module: non-squashed `git subtree` import from `Zhanfg/PatchNest-Module` main at `$module_main`.
          - PatchNest-Kpms: non-squashed `git subtree` import from `Zhanfg/PatchNest-Kpms` main at `$kpms_main`.
          - Source branches are mirrored under `provenance/module/*` and `provenance/kpms/*`.
          - Source tags are mirrored under `provenance/module/*` and `provenance/kpms/*`.
          - Historical GitHub Releases remain immutable in the source repositories and are not rewritten.
          - `Zhanfg/KernelPatch-Public` remains independent and is intentionally not imported.
          EOF
          git add docs/provenance/imports.md
          if ! git diff --cached --quiet; then
            git commit -m "[Monorepo] Record component provenance"
          fi
          git push origin HEAD:merge/patchnest-monorepo
