name: One-shot PatchNest monorepo verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-monorepo.yml'

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: merge/patchnest-monorepo
          fetch-depth: 0
      - name: Verify canonical runtime references
        run: |
          set -euo pipefail
          grep -Fq 'updateJson=https://raw.githubusercontent.com/Zhanfg/PatchNest/main/module/update.json' module/module/module.prop
          grep -Fq "https://raw.githubusercontent.com/Zhanfg/PatchNest/main/kpms/kpm_repo.json" module/webui/page/kpm_repo.js
          test "$(jq -r '.changelog' module/update.json)" = 'https://raw.githubusercontent.com/Zhanfg/PatchNest/main/module/CHANGELOG.md'
      - name: Inventory legacy repository references
        run: |
          set -euo pipefail
          git grep -n -E 'Zhanfg/(PatchNest-Module|PatchNest-Kpms)' -- ':!docs/provenance/**' || true

  kpms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: merge/patchnest-monorepo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate KPM catalog
        working-directory: kpms
        run: |
          set -euo pipefail
          node scripts/validate.js
          installable=$(node -e "for (const m of require('./kpm_repo.json').modules) console.log(m.source || '')")
          while IFS= read -r source; do
            [ -z "$source" ] && continue
            ! grep -Eq 'module_init\(|module_exit\(|MODULE_LICENSE\(' "$source"
            grep -q 'KPM_NAME(' "$source"
            grep -q 'KPM_INIT(' "$source"
          done <<< "$installable"

  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: merge/patchnest-monorepo
          fetch-depth: 0
      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r26b
      - name: Host tests and sanitizers
        working-directory: cli
        env:
          CC: gcc
        run: |
          set -euo pipefail
          sh tests/run_cli_contract_tests.sh
          sh tests/run_argv0_tests.sh
          sh tests/run_sanitizer_tests.sh
      - name: Deterministic Android builds
        working-directory: cli
        run: |
          set -euo pipefail
          for dir in verify-a verify-b; do
            cmake -S . -B "build/$dir" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DANDROID_PLATFORM=android-33 \
              -DANDROID_ABI=arm64-v8a
            cmake --build "build/$dir" --target kpatch --parallel
          done
          cmp build/verify-a/kpatch build/verify-b/kpatch
          file build/verify-a/kpatch | grep -q 'ELF 64-bit.*ARM aarch64'
      - name: Public1158 compatibility build
        working-directory: cli
        run: |
          set -euo pipefail
          cmake -S . -B build/verify-public1158 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-33 \
            -DANDROID_ABI=arm64-v8a
          cmake --build build/verify-public1158 --target kpatch-public1158 --parallel
          strings build/verify-public1158/kpatch-public1158 | grep -Fxq public1158
          strings build/verify-public1158/kpatch-public1158 | grep -Fxq hello1158

  module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: merge/patchnest-monorepo
          fetch-depth: 0
      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r26d
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: module/webui/pnpm-lock.yaml
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip unzip file shellcheck
      - name: WebUI tests
        working-directory: module
        run: |
          pnpm --dir webui install --frozen-lockfile
          pnpm --dir webui test
      - name: Build complete module
        working-directory: module
        run: bash build.sh
      - name: Validate complete module
        working-directory: module
        run: node tests/validate_module.js