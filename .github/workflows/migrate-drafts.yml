name: One-shot PatchNest draft migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-drafts.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: merge/patchnest-monorepo
          fetch-depth: 0

      - name: Configure Git and source remotes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add patchnest-module https://github.com/Zhanfg/PatchNest-Module.git
          git remote add patchnest-kpms https://github.com/Zhanfg/PatchNest-Kpms.git
          git fetch patchnest-module '+refs/heads/*:refs/remotes/patchnest-module/*'
          git fetch patchnest-kpms '+refs/heads/*:refs/remotes/patchnest-kpms/*'

      - name: Migrate KPM diagnostic draft
        run: |
          set -euo pipefail
          git checkout -B migration/kpms-diagnostic origin/merge/patchnest-monorepo
          git subtree pull --prefix=kpms patchnest-kpms fix/diagnostic-build-integrity
          git push origin HEAD:refs/heads/migration/kpms-diagnostic

      - name: Migrate Module reviewed flash-readiness draft
        run: |
          set -euo pipefail
          git checkout -B migration/module-flash-readiness origin/merge/patchnest-monorepo
          git subtree pull --prefix=module patchnest-module review/flash-readiness-hardening
          git push origin HEAD:refs/heads/migration/module-flash-readiness

      - name: Migrate FR-014 v2 candidate as stacked draft
        run: |
          set -euo pipefail
          git checkout -B migration/module-fr014-v2 migration/module-flash-readiness
          git subtree pull --prefix=module patchnest-module validation/device-flash-candidate-v2
          git push origin HEAD:refs/heads/migration/module-fr014-v2