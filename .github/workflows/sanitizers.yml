name: CLI sanitizers

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Reject unbounded program-name concatenation
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(strcat|strcpy)\s*\(' src --include='*.c' --include='*.h'; then
            echo '::error::Unbounded string copy/concatenation is forbidden in PatchNest CLI sources'
            exit 1
          fi

      - name: Run ASan and UBSan regressions
        env:
          CC: gcc
        run: sh tests/run_sanitizer_tests.sh
